# Default stack: SQLite in a named volume, public testnet RPC.
#   docker compose up -d --build
# Dashboard: http://localhost:8080   API: http://localhost:8000/docs
# Overrides: docker-compose.postgres.yml (PostgreSQL), docker-compose.demo.yml (offline fake RPC).

x-backend: &backend
  build: ./backend
  image: soroban-event-indexer:local
  env_file:
    - path: .env
      required: false
  volumes:
    - indexer-data:/data
  restart: unless-stopped

services:
  indexer:
    <<: *backend
    command: ["index"]
    stop_grace_period: 30s

  api:
    <<: *backend
    command: ["serve"]
    environment:
      API_HOST: 0.0.0.0
      API_PORT: "8000"
    ports:
      - "${API_PUBLISH_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build: ./frontend
    image: soroban-event-indexer-frontend:local
    ports:
      - "${FRONTEND_PUBLISH_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  indexer-data:
