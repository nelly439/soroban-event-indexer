[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "soroban-event-indexer"
version = "0.1.0"
description = "Self-hostable indexer for Soroban smart-contract events with a REST API."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
# Exact, tested versions live in requirements.txt / requirements-dev.txt.
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "stellar-sdk>=12.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]

[project.scripts]
soroban-indexer = "soroban_indexer.cli:main"

[tool.setuptools.packages.find]
include = ["soroban_indexer*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "D"]
ignore = ["D203", "D213", "D105", "D107"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"../tests-e2e/**" = ["D"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["soroban_indexer"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
